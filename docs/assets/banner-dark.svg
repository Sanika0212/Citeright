  <text x="58" y="162" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="22" fill="#c3c2b7">Is every reference real, correct and not retracted,</text>
  <text x="58" y="192" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="22" fill="#c3c2b7">and does it say what you cite it for?</text>
