[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "citeright"
version = "0.1.0"
description = "Check every citation in a draft: the reference exists, it is the paper you meant, it is not retracted, and it supports the sentence that cites it"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Sanika Najan", email = "sanikanajan@gmail.com" }]
requires-python = ">=3.11"
keywords = ["citations", "references", "bibtex", "fact-checking", "retractions", "scholarly", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Text Processing :: Markup :: LaTeX",
    "Typing :: Typed",
]
dependencies = ["httpx>=0.27", "numpy>=1.26"]

[project.optional-dependencies]
models = ["torch>=2.4", "transformers>=4.45", "sentencepiece>=0.2", "protobuf>=4.25"]
bench = ["pandas>=2.2", "pyarrow>=17", "scikit-learn>=1.5"]
viz = ["matplotlib>=3.9", "pillow>=10.4"]

[project.scripts]
citeright = "citeright.cli:main"

[project.urls]
Homepage = "https://github.com/Sanika0212/Citeright"
Issues = "https://github.com/Sanika0212/Citeright/issues"

[dependency-groups]
dev = ["pytest>=8.3", "hypothesis>=6.112", "ruff>=0.7", "mypy>=1.13", "coverage>=7.6", "scikit-learn>=1.5"]

[tool.hatch.build.targets.wheel]
packages = ["src/citeright"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PT"]
# SIM905: word lists read better as one split string than as many quoted items.
ignore = ["RUF001", "RUF002", "RUF003", "SIM905"]

[tool.ruff.lint.per-file-ignores]
# Embedded CSS and HTML for the self-contained report; SVG templates in the figures.
"src/citeright/report.py" = ["E501"]
"scripts/make_figures.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
files = ["src/citeright"]

[[tool.mypy.overrides]]
module = ["torch.*", "transformers.*", "matplotlib.*", "pandas.*", "pyarrow.*", "sklearn.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers -p no:cacheprovider"

[tool.coverage.run]
source = ["citeright"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]
